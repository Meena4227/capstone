<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctor Login | TeleCare</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="doctor-login-page">

        <div class="doctor-login-card">

            <!-- Doctor Icon -->

            <div class="doctor-login-icon">
                👨‍⚕️
            </div>

            <!-- Logo -->

            <div class="doctor-login-brand">
                🩺 TeleCare
            </div>

            <span class="doctor-login-label">
                🏥 DOCTOR PORTAL
            </span>

            <h1>
                Welcome Back, Doctor! 👋
            </h1>

            <p>
                Login to manage your patients,
                appointments and consultations. 💙
            </p>


            <!-- Login Form -->

            <form action="doctor-dashboard.html">

                <label>
                    📧 Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your doctor email"
                    required
                >


                <label>
                    🔒 Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="doctor-login-options">

                    <label class="remember-doctor">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="doctor-login-btn">

                    👨‍⚕️ Login to Doctor Dashboard

                </button>

            </form>


            <!-- Healthcare Message -->

            <div class="doctor-login-message">

                🩺 &nbsp; Caring for patients,
                one consultation at a time. ❤️

            </div>


            <!-- Back -->

            <div class="doctor-back">

                <a href="index.html">
                    🏠 Back to Home
                </a>

            </div>

        </div>

    </main>

</body>

</html>
